policy:
  type: act
  device: cuda
  repo_id: "Armstrong-Couch/act_xarm_plate_pinch"


dataset:
  repo_id: "Armstrong-Couch/xarm_plate_pinch"
  single_task: "Pick the top plate from the stack on the right side and place it back down on the left side"
  fps: 30
  episode_time_s: 180
  reset_time_s: 60
  num_episodes: 50
  push_to_hub: True
  private: False
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4

display_data: True
resume: True
